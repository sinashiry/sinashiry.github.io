# Generated by scripts/generate-pages-config.mjs from content/structure.json,
# content/contract.json and content/labels.json. Do not edit by hand.
settings:
  hide: true
  content: { merge: false }
  commit:
    identity: app
    templates:
      create: "Create {path} via Pages CMS {userName}"
      update: "Update {path} via Pages CMS {userName}"
      delete: "Delete {path} via Pages CMS {userName}"
      rename: "Rename {oldPath} to {newPath} via Pages CMS {userName}"
media:
  - name: images
    label: "Article & paper images (public)"
    input: public/assets/owner-media
    output: "/assets/owner-media"
    extensions: [jpg, jpeg, png, webp]
    rename: random
  - name: papers
    label: "Paper PDFs (public)"
    input: public/assets/owner-media/papers
    output: "/assets/owner-media/papers"
    extensions: [pdf]
    rename: safe
  - name: cv
    label: "CV PDF versions (public in the repository; the website uses the selected ones)"
    input: content/uploads/cv
    output: content/uploads/cv
    extensions: [pdf]
    rename: safe
actions:
  - name: refresh-github
    label: "Refresh GitHub repositories"
    workflow: github-repositories.yml
    ref: main
    confirm:
      title: "Refresh the GitHub repository list?"
      message: "Reads the public repositories on GitHub and updates the Code page. The website changes a few minutes after the run finishes, and only if something changed."
      button: Refresh
content:
  - name: group-profile
    label: "Profile & CV"
    type: group
    items:
      - name: profile
        label: "Profile & homepage"
        type: file
        path: content/cms/profile.json
        format: json
        operations: { delete: false }
        fields:
          - name: name
            label: Name
            type: string
            required: true
            options: { maxlength: 500 }
          - name: eyebrow
            label: "Small heading above the homepage headline"
            description: "Short capitalised line shown above the homepage headline."
            type: string
            required: true
            options: { maxlength: 500 }
          - name: summary
            label: "About summary"
            type: text
            required: true
            options: { maxlength: 3000 }
          - name: email
            label: "Public email address"
            description: "Shown on the website and used by every email link and button."
            type: string
            required: true
            pattern:
              regex: "^[^\\s@?#%&]+@[^\\s@?#%&]+\\.[^\\s@?#%&]+$"
              message: "Enter a valid email address"
            options: { maxlength: 254 }
          - name: location
            label: Location
            type: string
            required: true
            options: { maxlength: 500 }
          - name: availability
            label: "Availability line"
            type: string
            required: true
            options: { maxlength: 500 }
          - name: researchInterests
            label: "Research interests"
            description: "Shown on the Research page. The website shows exactly 4 entries here."
            type: string
            required: true
            list: { min: 4, max: 4, collapsible: false }
            options: { maxlength: 500 }
          - name: headlineStart
            label: "Homepage headline, line 1"
            type: string
            required: true
            options: { maxlength: 500 }
          - name: headlineMiddle
            label: "Homepage headline, line 2"
            type: string
            required: true
            options: { maxlength: 500 }
          - name: headlineEnd
