          - name: references
            label: "Academic references"
            description: "Public: everything saved here, including email addresses, becomes public in the GitHub repository and its history as soon as you save, even while \"Approved\" is \"no\". Add a referee only with their permission. A reference is shown on the website only when it is approved and its name, position and relationship are complete. Items are fixed: edit them in place. Adding, removing or reordering items needs the maintainer."
