                list: { min: 1, max: 1, collapsible: false }
                options: { maxlength: 3000 }
          - name: system
            label: "System architecture"
            description: "Items are fixed: edit them in place. Adding, removing or reordering items needs the maintainer."
            type: object
            list:
              min: 5
              max: 5
              collapsible: { collapsed: true, summary: "{label}" }
            fields:
              - name: label
                label: Part
                type: string
                required: true
                options: { maxlength: 500 }
              - name: description
                label: Description
                type: text
                required: true
                options: { maxlength: 3000 }
          - name: galleries
            label: "Gallery images"
            description: "Edit captions and image descriptions only; the image files are fixed. Items are fixed: edit them in place. Adding, removing or reordering items needs the maintainer."
            type: object
            list:
              min: 1
              max: 1
              collapsible: { collapsed: true, summary: "{index}. {caption}" }
            fields:
              - name: src
                label: "Image file (fixed)"
                description: "Fixed identifier; it cannot be changed here."
                type: string
                readonly: true
              - name: alt
                label: "Image description for screen readers"
                type: string
                required: true
                options: { maxlength: 500 }
              - name: caption
                label: Caption
                type: string
                required: true
                options: { maxlength: 500 }
          - name: videos
            label: Videos
            description: "Edit titles and captions only; the video files are fixed. Items are fixed: edit them in place. Adding, removing or reordering items needs the maintainer."
            type: object
            list:
              min: 1
              max: 1
              collapsible: { collapsed: true, summary: "{index}. {title}" }
            fields:
              - name: src
                label: "Video file (fixed)"
                description: "Fixed identifier; it cannot be changed here."
                type: string
                readonly: true
              - name: title
                label: "Video title"
                type: string
                required: true
                options: { maxlength: 500 }
              - name: caption
                label: Caption
                type: string
                required: true
                options: { maxlength: 500 }
          - name: strength
            label: "Project card highlight"
            description: "Short line shown on the project card."
            type: string
            required: true
            options: { maxlength: 500 }
          - name: highlights
            label: Highlights
            description: "The website shows exactly 3 entries here."
            type: string
            required: true
            list: { min: 3, max: 3, collapsible: false }
            options: { maxlength: 500 }
          - name: contribution
            label: "Contribution details"
            description: "Optional. Hidden on the website when empty."
            type: text
            options: { maxlength: 3000 }
          - name: result
            label: "Delivered scope"
            description: "Optional. Hidden on the website when empty."
            type: text
            options: { maxlength: 3000 }
          - name: decisionNotes
            label: "Engineering decisions"
            description: "Optional. Hidden on the website when empty."
            type: text
            options: { maxlength: 3000 }
          - name: validationNotes
            label: "Validation & evidence"
            description: "Optional. Hidden on the website when empty."
            type: text
            options: { maxlength: 3000 }
          - name: measuredOutcome
            label: "Measured outcome"
            description: "Only a measurement you can support with evidence. Leave empty otherwise; the website then hides this part."
            type: text
            options: { maxlength: 3000 }
          - name: referenceUrl
            label: "Project source or reference link"
            description: "Optional public link starting with https://, for example the project's source code. Leave empty if there is none."
            type: string
            pattern:
              regex: "^$|^https://[^\\s\\\\/?#@]+(?:[/?#][^\\s\\\\]*)?$"
              message: "Use a public address starting with https://"
            options: { maxlength: 2048 }
  - name: downloads
    label: "Downloadable CVs"
    type: file
    path: content/cms/downloads.json
    format: json
    operations: { delete: false }
    fields:
      - name: engineeringCv
        label: "Engineering CV (PDF)"
        description: "Upload a new version under Media › CV PDF versions, then select it here. It replaces /downloads/Sina_Shiri_Engineering_CV.pdf after the next deploy. The LaTeX source is not updated."
        type: file
        required: true
        options:
          media: cv
          extensions: [pdf]
      - name: academicCv
        label: "Academic CV (PDF)"
        description: "Upload a new version under Media › CV PDF versions, then select it here. It replaces /downloads/Sina_Shiri_Masters_CV.pdf after the next deploy. The LaTeX source is not updated."
        type: file
        required: true
        options:
          media: cv
          extensions: [pdf]
  - name: posts
    label: "Blog posts"
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    subfolders: false
    filename: "{fields.slug}.md"
    operations: { rename: false, delete: false }
    view:
      primary: title
      fields: [title, date, visibility]
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - name: title
        label: Title
        description: "Shown as the heading of the post and in the post list. The web address is set separately below."
        type: string
        required: true
        options: { maxlength: 220 }
      - name: slug
        label: "Web address"
        description: "The post is published at /blog/<web address>/, for example /blog/raspberry-pi-camera-notes/. Use lowercase letters, digits and single hyphens, at most 80 characters, and not a reserved word such as admin, index, blog, feed or sitemap. The address is fixed when the post is first saved: changing this field later does not move the post."
        type: string
        required: true
        pattern:
          regex: "^(?!(?:admin|api|assets|blog|publications|index|index-html|page|pages|feed|rss|sitemap|sitemap-xml|tags|categories|new|edit|preview|draft|templates)$)[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "Use lowercase letters, digits and single hyphens, not a reserved word such as admin, index, blog, feed or sitemap"
        options: { maxlength: 80 }
      - name: date
        label: Date
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: summary
        label: Summary
        description: "Shown in the post list and in search results."
        type: text
        required: true
        options: { maxlength: 600 }
      - name: visibility
        label: "Website visibility"
        description: "Draft: not shown on the website. Published: shown after the next deploy. Archived: removed from the website; the post address stays reserved. Everything saved here, including drafts, is public in the GitHub repository and its history."
        type: select
        required: true
        default: draft
        options:
          values: [draft, published, archived]
      - name: heroImage
        label: "Header image"
        description: "Optional. Upload under Media › Article & paper images. Uploaded images are public in the repository immediately."
        type: image
        options: { media: images }
      - name: heroAlt
        label: "Header image description"
        description: "Required before publishing when a header image is chosen: describe the image for people who cannot see it."
        type: string
        options: { maxlength: 400 }
      - name: relatedProject
        label: "Related engineering project"
        description: Optional.
        type: select
        options:
          values:
            - name: industrial-alarm-monitoring
              label: "Industrial alarm monitoring"
            - name: fire-smoke-vision
              label: "Fire & smoke vision"
            - name: embedded-qr-scanner
              label: "Embedded QR scanner"
            - name: rfid-attendance
              label: "Offline RFID attendance"
            - name: networked-polling
              label: "Networked polling terminals"
            - name: zynq-object-detection
              label: "Object detection on Zynq"
            - name: aerial-object-tracking
              label: "Aerial object tracking"
            - name: industrial-data-graph
              label: "Industrial DataGraph"
            - name: food-reservation-system
              label: "RFID food reservation"
            - name: two-line-caller-id
              label: "Two-line caller ID"
      - name: updated
        label: "Last updated"
        description: "Optional. Set when a published post changes substantially."
        type: date
        default: ""
        options: { format: yyyy-MM-dd }
      - name: body
        label: Article
        description: "Separate paragraphs with a blank line. Supported: ## and ### headings, - lists, **bold**, `code`, fenced code blocks, [text](https://…) links and ![description](/assets/…) images. HTML is not allowed."
        type: text
        required: true
        options: { maxlength: 60000 }
  - name: papers
    label: "Publications (papers)"
    type: collection
    path: src/content/papers
    format: json
    subfolders: false
    filename: "{fields.year}-{primary}.json"
    operations: { rename: false }
    view:
      primary: title
      fields: [title, year, status, visibility]
      sort: [year, title]
      default: { sort: year, order: desc }
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options: { maxlength: 300 }
      - name: authors
        label: Authors
        description: "As they appear on the paper, for example \"S. Shiri, A. Author\"."
        type: text
        required: true
        options: { maxlength: 1000 }
      - name: year
        label: Year
        type: string
        required: true
        pattern: { regex: "^(?:19[0-9]{2}|20[0-9]{2}|2100)$", message: "Enter a year between 1900 and 2100" }
      - name: type
        label: Type
        description: "For example: Journal article, Conference paper, Thesis."
        type: string
        required: true
        options: { maxlength: 80 }
      - name: status
        label: "Publication status"
        description: "Used to group papers on the Publications page."
        type: select
        required: true
        options:
          values: [Published, Accepted, "Under review", Submitted, Preprint, Manuscript, Other]
      - name: visibility
        label: "Website visibility"
        description: "Draft: not shown on the website. Published: shown after the next deploy. Archived: removed from the website. Everything saved here, including drafts, is public in the GitHub repository and its history."
        type: select
        required: true
        default: draft
        options:
          values: [draft, published, archived]
      - name: venue
        label: "Journal, conference or publisher"
        type: string
        options: { maxlength: 300 }
      - name: doi
        label: DOI
        description: "Only the DOI itself, for example 10.1000/xyz123, without https://doi.org/."
        type: string
        pattern: { regex: "^$|^10\\.[0-9]{4,9}/[^\\s<>\"]+$", message: "Enter a DOI such as 10.1000/xyz123" }
        options: { maxlength: 200 }
      - name: link
        label: "Publication link"
        description: "Optional public address starting with https://."
        type: string
        pattern:
          regex: "^$|^(?=[\\x21-\\x7e]*$)https://[^\\s\\\\/?#@]+(?:[/?#][^\\s\\\\]*)?$"
          message: "Use a public address starting with https:// (letters, digits and ASCII punctuation only)"
        options: { maxlength: 2048 }
      - name: code
        label: "Code link"
        description: "Optional public address of the code starting with https://."
        type: string
        pattern:
          regex: "^$|^(?=[\\x21-\\x7e]*$)https://[^\\s\\\\/?#@]+(?:[/?#][^\\s\\\\]*)?$"
          message: "Use a public address starting with https:// (letters, digits and ASCII punctuation only)"
        options: { maxlength: 2048 }
      - name: pdf
        label: PDF
        description: "Optional. Upload under Media › Paper PDFs, then select it here. Uploaded PDFs are public in the repository immediately."
        type: file
        options:
          media: papers
          extensions: [pdf]
      - name: abstract
        label: Abstract
        type: text
        options: { maxlength: 10000 }
      - name: contribution
        label: Contribution
        description: "Optional. What Sina contributed to this paper."
        type: text
        options: { maxlength: 3000 }
      - name: citation
        label: Citation
        description: "Optional. Formatted citation shown under the paper."
        type: text
        options: { maxlength: 5000 }
      - name: relatedProject
        label: "Related engineering project"
        description: Optional.
        type: select
        options:
          values:
            - name: industrial-alarm-monitoring
              label: "Industrial alarm monitoring"
            - name: fire-smoke-vision
              label: "Fire & smoke vision"
            - name: embedded-qr-scanner
              label: "Embedded QR scanner"
            - name: rfid-attendance
              label: "Offline RFID attendance"
            - name: networked-polling
              label: "Networked polling terminals"
            - name: zynq-object-detection
              label: "Object detection on Zynq"
            - name: aerial-object-tracking
              label: "Aerial object tracking"
            - name: industrial-data-graph
              label: "Industrial DataGraph"
            - name: food-reservation-system
              label: "RFID food reservation"
            - name: two-line-caller-id
              label: "Two-line caller ID"
      - name: featured
        label: Featured
        description: "Featured papers are listed first."
        type: boolean
        default: false
