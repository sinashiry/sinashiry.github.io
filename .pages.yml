                type: string
                options: { maxlength: 200 }
              - name: status
                label: "Author's professional status"
                type: string
                options: { maxlength: 200 }
              - name: relationship
                label: "Working relationship"
                type: string
                options: { maxlength: 200 }
              - name: approved
                label: "Approved for publication by the author"
                description: "Choose \"yes\" only after the author has agreed to publication."
                type: select
                required: true
                options:
                  values: ["yes", "no"]
              - name: context
                label: "Shared project or context"
                type: string
                options: { maxlength: 200 }
              - name: organization
                label: Organization
                type: string
                options: { maxlength: 200 }
              - name: date
